<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifrax — Legal</title>
<style>
  :root{
    --bg:#0F0F12; --surface:#17171c; --text:#e8e8ea; --muted:#9a9aa2;
    --gold:#C9A84C; --border:#26262e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
  }
  .wrap{width:100%;max-width:480px;padding:40px 24px;text-align:center}
  .logo{font-size:42px;font-weight:700;letter-spacing:4px;margin-bottom:8px}
  .logo .x{color:var(--gold)}
  .tagline{color:var(--muted);font-size:15px;margin-bottom:48px}
  .actions{display:flex;flex-direction:column;gap:16px}
  .btn{
    display:block;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:22px 24px;color:var(--text);
    font-size:17px;font-weight:600;text-decoration:none;
    transition:border-color .2s ease, transform .08s ease;
  }
  .btn:hover{border-color:var(--gold)}
  .btn:active{transform:scale(.99)}
  .btn span{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:6px}
  footer{margin-top:48px;color:var(--muted);font-size:13px}
  footer a{color:var(--gold);text-decoration:none}
  @media(max-width:600px){.logo{font-size:34px}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">CIFRA<span class="x">X</span></div>
    <p class="tagline">Navegador de privacidad para Android</p>

    <div class="actions">
      <a class="btn" href="privacy-policy.html">
        Política de Privacidad
        <span>Cómo protegemos tus datos</span>
      </a>
      <a class="btn" href="terms-of-service.html">
        Términos del Servicio
        <span>Condiciones de uso y suscripción</span>
      </a>
    </div>

    <footer>
      © 2026 Cifrax · <a href="mailto:cifrax.app@gmail.com">cifrax.app@gmail.com</a>
    </footer>
  </div>
</body>
</html>
